name: Initialize independent companion starter
on:
  push:
    branches: [main]
    paths: [.github/workflows/initialize-starter.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: initialize-starter
  cancel-in-progress: false
jobs:
  copy:
    if: github.repository == 'Flyingsparks1130/dominatornetworktourney2026-companion-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy the tested source and history
        shell: bash
        run: |
          set -euo pipefail
          test ! -f companion.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add source https://github.com/Flyingsparks1130/dominatornetworktourney2026.git
          git fetch source codex/companion-foundation
          test "$(git rev-parse FETCH_HEAD)" = '61b8f33253bc438427071aa195a012772feca0a1'
          git merge --allow-unrelated-histories --no-ff --no-edit FETCH_HEAD
      - name: Keep the copied starter independent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          repo = 'dominatornetworktourney2026-companion-starter'
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          title, separator, rest = text.partition('## Updates through ChatGPT / Codex')
          assert separator
          header = f'''# Dominator Tournament Companion Starter

          This is a separate repository copied from [the original 2026 tournament](https://github.com/Flyingsparks1130/dominatornetworktourney2026), with the companion-compatible results foundation included. The original repository and live website are separate.

          Start with `preview_companion.bat` and `companion.html`. [Connection guide](docs/companion-integration.md) · [Build checks](https://github.com/Flyingsparks1130/{repo}/actions/workflows/tournament-pages.yml)

          The copied 2026 records are preserved as historical material, not a new event. New scoring rules remain undecided. This starter has no published results feed and does not deploy a website by default.

          '''
          text = header + separator + rest
          text = text.replace('GitHub Actions rebuilds and publishes on updates to `main`.', 'GitHub Actions validates updates to `main`. Pages publication also requires Pages setup and the repository variable `PUBLISH_PAGES=true`; leave it unset while this is a starter.')
          readme.write_text(text, encoding='utf-8')
          guide = Path('docs/companion-integration.md')
          text = guide.read_text(encoding='utf-8').replace('| Repository | `dominatornetworktourney2026` |', f'| Repository | `{repo}` |')
          text += '\n## Independent copy publication\n\nThis starter requires GitHub Pages setup and the repository variable `PUBLISH_PAGES=true` before deploying. Leave publication off until the tournament format and site are ready.\n'
          guide.write_text(text, encoding='utf-8')
          workflow = Path('.github/workflows/tournament-pages.yml')
          text = workflow.read_text(encoding='utf-8')
          condition = "if: github.event_name != 'pull_request'"
          assert text.count(condition) == 3
          text = text.replace(condition, condition + " && vars.PUBLISH_PAGES == 'true'")
          workflow.write_text(text, encoding='utf-8')
          PY
      - name: Validate the copied foundation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          node tests/test_companion.cjs
          node tests/test_companion_client.cjs
          node scripts/companion_bridge.cjs check
          python scripts/tournament_engine.py build
          node scripts/build_public_stats.cjs
          python scripts/tournament_engine.py site
          node tests/test_replay_client.js
          node tests/test_championship_client.js
          node tests/test_awards_client.js
          node tests/test_award_telemetry.js
          node tests/test_tournament_statistics.cjs
          git restore -- data/tournament-index.json data/tournament-statistics.json data/tournament-races
          git diff --check
      - name: Save only into the independent repository
        shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/companion-integration.md .github/workflows/tournament-pages.yml
          git commit -m 'Document the independent starter and keep Pages publication opt-in'
          git push origin HEAD:main
